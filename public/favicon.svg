<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.85"/>
  
  <!-- Stylized "A" Monogram of Amaica -->
  <path d="M 15 50 L 28.5 15 L 35.5 15 L 49 50 L 41.5 50 L 32 25 L 22.5 50 Z" fill="url(#goldGrad)"/>
  
  <!-- Editorial Crossbar / Crimson Signal -->
  <polygon points="20,38.5 44,38.5 42,34 22,34" fill="url(#crimsonGrad)"/>
  
  <!-- Intelligence Beacon Dot -->
  <circle cx="32" cy="10.5" r="2.5" fill="#fbbf24"/>
</svg>
